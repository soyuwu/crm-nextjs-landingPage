<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050706" />
    <meta name="description" content="HYPE Training Lab – Turn It Up." />
    <title>Đăng ký trải nghiệm | HYPE Training Lab</title>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32.png"
    />
    <link rel="apple-touch-icon" href="assets/images/favicon-180.png" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="trial">
    <main>
      <section class="section" id="lead-form">
        <div class="container narrow">
          <form class="form-grid" data-lead-form data-source="Website Lead">
            <div class="form-group">
              <label>Họ và tên</label>
              <input
                name="name"
                required
                autocomplete="name"
                placeholder="Tên của bạn"
              />
            </div>

            <div class="form-group">
              <label>Số điện thoại</label>
              <input
                name="phone"
                required
                autocomplete="tel"
                placeholder="09xx xxx xxx"
              />
            </div>

            <div class="form-group full">
              <label>Email</label>
              <input
                type="email"
                name="email"
                required
                autocomplete="email"
                placeholder="email@example.com"
              />
            </div>

            <div class="form-group">
              <label>Độ tuổi</label>
              <select name="age_group" required>
                <option value="">Chọn độ tuổi</option>
                <option value="18-22">18 - 22</option>
                <option value="23-30">23 - 30</option>
                <option value="31-40">31 - 40</option>
                <option value="40+">Trên 40</option>
              </select>
            </div>

            <div class="form-group">
              <label>Mục tiêu tập luyện</label>
              <select name="goal" required>
                <option value="">Chọn mục tiêu</option>
                <option value="weight_loss">Giảm cân</option>
                <option value="muscle_gain">Tăng cơ</option>
                <option value="fitness">Nâng cao sức khỏe</option>
                <option value="sports_performance">
                  Cải thiện thể lực thể thao
                </option>
                <option value="rehabilitation">Phục hồi vận động</option>
              </select>
            </div>

            <div class="form-group">
              <label>Ngân sách dự kiến mỗi tháng</label>
              <select name="budget" required>
                <option value="">Chọn ngân sách</option>
                <option value="<1m">Dưới 1 triệu</option>
                <option value="1-3m">1 - 3 triệu</option>
                <option value="3-5m">3 - 5 triệu</option>
                <option value="5m+">Trên 5 triệu</option>
              </select>
            </div>

            <div class="form-group">
              <label>Khi nào bạn muốn bắt đầu?</label>
              <select name="start_time" required>
                <option value="">Chọn thời gian</option>
                <option value="today">Ngay hôm nay</option>
                <option value="this_week">Trong tuần này</option>
                <option value="this_month">Trong tháng này</option>
                <option value="just_looking">Chỉ tìm hiểu trước</option>
              </select>
            </div>

            <div class="form-group">
              <label>Tần suất tập dự kiến</label>
              <select name="workout_frequency" required>
                <option value="">Chọn tần suất</option>
                <option value="1-2">1 - 2 buổi/tuần</option>
                <option value="3-4">3 - 4 buổi/tuần</option>
                <option value="5-6">5 - 6 buổi/tuần</option>
                <option value="daily">Gần như mỗi ngày</option>
              </select>
            </div>

            <div class="form-group">
              <label>Khung giờ ưu tiên</label>
              <select name="preferred_time">
                <option value="">Chọn khung giờ</option>
                <option value="06-10">06:00 - 10:00</option>
                <option value="10-16">10:00 - 16:00</option>
                <option value="16-19">16:00 - 19:00</option>
                <option value="19-22">19:00 - 22:00</option>
              </select>
            </div>

            <div class="form-group.full">
              <label>Mô tả mục tiêu hoặc nhu cầu của bạn</label>
              <textarea
                name="note"
                placeholder="Ví dụ: Tôi muốn giảm 10kg trong 4 tháng và có thể tập buổi tối."
              ></textarea>
            </div>

            <label class="check-row.full">
              <input type="checkbox" name="policy" value="yes" required />
              <span>
                Tôi đồng ý cho HYPE xử lý dữ liệu nhằm mục đích tư vấn.
              </span>
            </label>

            <div class="form-group full">
              <button class="btn primary block" type="submit">
                Gửi yêu cầu tư vấn
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
    <script src="assets/js/site-data.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
